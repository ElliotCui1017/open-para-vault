name: Starter vault release assets

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  package-release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Run public validation
        run: |
          python scripts/preflight_public.py .
          python scripts/validate_repo.py .
          python scripts/validate_templates.py .
          python -m unittest discover -s tests -v

      - name: Test bootstrap behavior
        shell: pwsh
        run: ./tests/test_bootstrap_public_repo.ps1

      - name: Build tagged starter vault
        run: python scripts/build_starter_vault.py --version "${{ github.ref_name }}" --output dist

      - name: Verify checksum
        working-directory: dist
        run: sha256sum --check "open-para-vault-${{ github.ref_name }}.zip.sha256"

      - name: Create draft release or use matching release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="RELEASE_NOTES_${TAG}.md"
          test -f "$notes"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_tag="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
            test "$release_tag" = "$TAG"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Open PARA Vault $TAG" --notes-file "$notes"
          fi

      - name: Upload assets without overwriting
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip_name="open-para-vault-${TAG}.zip"
          checksum_name="${zip_name}.sha256"
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if grep -Fxq "$zip_name" <<<"$existing" || grep -Fxq "$checksum_name" <<<"$existing"; then
            echo "Refusing to overwrite an existing release asset for $TAG" >&2
            exit 1
          fi
          gh release upload "$TAG" "dist/$zip_name" "dist/$checksum_name" --repo "$GITHUB_REPOSITORY"
