name: Public validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Scan public tree and Git history
        run: python scripts/preflight_public.py .

      - name: Validate repository structure
        run: python scripts/validate_repo.py .
